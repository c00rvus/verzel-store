<!doctype html>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">

    <symbol id="i-list" viewBox="0 0 24 24"><path d="m3 6 1 1 2-2m3 1h12M3 12h3m3 0h12M3 18h3m3 0h12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="14" rx="5"/><path d="m9 7-2-4m8 4 2-4M3 10h4m10 0h4M3 16h4m10 0h4M12 7v14"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8M8 17h6"/></symbol>

  <a class="skip" href="#main">Ir para o conteúdo</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" data-page="overview" aria-label="QA Verzel, visão geral"><span class="brand-mark">Q<span>A</span></span><span>Verzel Store</span></a>
    <div class="project-label">c00rvus <span>VZS-142 · 2.3.0</span></div>
    <nav aria-label="Seções do projeto">
      <button data-page="overview" class="nav-button active"><svg><use href="#i-grid"/></svg>Visão geral</button>
      <button data-page="cases" class="nav-button"><svg><use href="#i-list"/></svg>Cenários e resultados<span class="nav-count" id="nav-cases">—</span></button>
      <button data-page="automation" class="nav-button"><svg><use href="#i-code"/></svg>Automação<span class="nav-count" id="nav-automation">—</span></button>
      <button data-page="evidence" class="nav-button"><svg><use href="#i-image"/></svg>Evidências</button>
      <button data-page="bugs" class="nav-button"><svg><use href="#i-bug"/></svg>Bugs<span class="nav-count red" id="nav-bugs">—</span></button>
      <button data-page="documents" class="nav-button"><svg><use href="#i-file"/></svg>Documentos</button>
    </nav>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb" id="breadcrumb">Visão geral</div><div class="top-actions"><a class="text-button" href="https://verzel-store.qa-test-verzel-store.workers.dev/" target="_blank" rel="noopener noreferrer">Abrir loja <svg><use href="#i-external"/></svg></a><button class="button compact" id="refresh"><svg><use href="#i-refresh"/></svg>Atualizar</button></div></header>
    <main id="main" tabindex="-1"><div class="loading-state"><div class="spinner"></div><h1>Carregando o projeto</h1></div></main>
  </div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><div><span class="eyebrow" id="dialog-eyebrow"></span><h2 id="dialog-title"></h2></div><button class="icon-button" id="close-dialog" aria-label="Fechar detalhe"><svg><use href="#i-close"/></svg></button></div><div id="dialog-body"></div></dialog>
  <dialog id="image-dialog" class="image-dialog" aria-labelledby="image-title">
    <div class="dialog-top"><h2 id="image-title">Captura</h2><button class="icon-button" id="close-image" aria-label="Fechar captura"><svg><use href="#i-close"/></svg></button></div>
    <div class="image-tools">
      <button class="button compact" id="previous-image">← Anterior</button><span id="image-position"></span><button class="button compact" id="next-image">Próxima →</button>
      <div class="image-zoom-controls"><label for="image-zoom">Zoom</label><input id="image-zoom" type="range" min="1" max="200" step="1" value="100" aria-label="Zoom da imagem"><output id="image-zoom-value" for="image-zoom">100%</output><button class="button compact" id="fit-image">Ajustar à janela</button></div>
      <a class="text-button" id="image-original" target="_blank" rel="noopener">Abrir original <svg><use href="#i-external"/></svg></a>
    </div>
    <div class="image-stage" role="region" aria-label="Área da imagem" tabindex="0"><div class="image-canvas"><img id="large-image" alt=""></div></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="./syntax.js" defer data-manual></script>
  <script src="./app.js" defer></script>
</body>
</html>
